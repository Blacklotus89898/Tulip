name: Build and Push Tulip Image

# Pushes ghcr.io/blacklotus89898/tulip:<commit-sha> on main. SHA tags only —
# no :latest (the Homelab deploys pin a SHA; Kyverno rejects :latest anyway).
# First push creates a PRIVATE package: flip it to public once in the GitHub
# UI (Packages → tulip → Package settings) or the cluster gets ImagePullBackOff.
on:
  push:
    branches: [main]
    paths: ['Dockerfile', 'go.mod', 'go.sum', '**.go', '.github/workflows/build-image.yaml']
  pull_request:
    paths: ['Dockerfile', 'go.mod', 'go.sum', '**.go', '.github/workflows/build-image.yaml']
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          build-args: VERSION=${{ github.sha }}
          tags: ghcr.io/blacklotus89898/tulip:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
